<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周末的小萤火虫工作室 // DOWNLOAD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23050810'/%3E%3Ccircle cx='12' cy='14' r='3' fill='%2300e5ff'/%3E%3Ccircle cx='12' cy='19' r='1.5' fill='%2300ff9d'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #050810;
  --bg2: #0a1020;
  --surface: #0c1424;
  --surface2: #111c33;
  --line: #1a2a4a;
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,.15);
  --purple: #7c4dff;
  --green: #00ff9d;
  --pink: #ff5370;
  --text: #d0e8f0;
  --muted: #5a7a8a;
  --radius: 16px;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 15px; line-height: 1.6;
  min-height: 100vh; display: flex; flex-direction: column;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(0,229,255,.08), transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(124,77,255,.08), transparent 50%),
    linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
}
.container { max-width: 1080px; width: 100%; margin: 0 auto; padding: 0 22px; }
a { color: var(--cyan); text-decoration: none; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(5,8,16,.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; color: var(--text); }
.brand .logo {
  width: 36px; height: 36px; border-radius: 9px;
  background: var(--bg2); border: 1px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(0,229,255,.3);
}
.brand small { display: block; font-size: 10px; font-weight: 400; color: var(--cyan); font-family: var(--mono); letter-spacing: 2px; }
.nav-links { display: flex; gap: 22px; font-size: 13px; font-family: var(--mono); }
.nav-links a { color: var(--muted); }
.nav-links a:hover { color: var(--cyan); }

.hero { padding: 60px 0 30px; }
.hero .tag { font-family: var(--mono); font-size: 12px; color: var(--green); letter-spacing: 3px; margin-bottom: 12px; }
.hero h1 { margin: 0 0 12px; font-size: 36px; font-weight: 800; letter-spacing: -1px; }
.hero h1 .accent { color: var(--cyan); text-shadow: 0 0 20px rgba(0,229,255,.5); }
.hero p { margin: 0; color: var(--muted); font-size: 15px; max-width: 560px; }

.product-list { padding-bottom: 50px; }
.product-entry {
  display: flex; align-items: center; gap: 18px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 24px;
  margin-bottom: 14px; color: var(--text);
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.product-entry:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 24px rgba(0,229,255,.15), 0 8px 30px rgba(0,0,0,.3);
  transform: translateY(-2px);
}
.pe-icon {
  width: 52px; height: 52px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--cyan-dim); color: var(--cyan);
  border: 1px solid rgba(0,229,255,.3);
}
.pe-icon.purple { background: rgba(124,77,255,.12); color: var(--purple); border-color: rgba(124,77,255,.3); }
.pe-info { flex: 1; min-width: 0; }
.pe-name { font-weight: 700; font-size: 17px; }
.pe-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pe-ver { font-family: var(--mono); font-size: 11px; color: var(--green); margin-top: 4px; }
.pe-arrow { color: var(--muted); flex: none; }

.back { display: inline-flex; align-items: center; gap: 6px; margin: 24px 0 16px; color: var(--cyan); font-family: var(--mono); font-size: 13px; }
.back:hover { text-shadow: 0 0 10px rgba(0,229,255,.5); }
.page-title { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
.page-sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; font-family: var(--mono); }

.dl-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 50px;
}
.dl-layout { display: grid; grid-template-columns: 1.1fr 1fr; }
.dl-left { padding: 32px; border-right: 1px solid var(--line); }
.dl-right { padding: 32px; background: var(--bg2); }

.platform-tabs { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 22px; }
.platform-tabs button {
  border: none; background: transparent; padding: 8px 20px; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
  font-family: var(--mono); display: inline-flex; align-items: center; gap: 7px;
}
.platform-tabs button.active { background: var(--cyan-dim); color: var(--cyan); }

.version-label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 2px; margin: 0 0 8px; }
.version-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--muted);
  font-family: var(--mono);
}
.chip:hover { border-color: var(--cyan); color: var(--cyan); }
.chip.active { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }

.big-download {
  display: flex; align-items: center; gap: 16px;
  background: var(--green); color: #050810; border-radius: 12px;
  padding: 20px 24px; cursor: pointer;
  border: none; width: 100%; font-family: var(--sans); font-weight: 700;
  transition: box-shadow .2s, transform .1s;
  box-shadow: 0 0 24px rgba(0,255,157,.25);
}
a.big-download:hover { box-shadow: 0 0 36px rgba(0,255,157,.45); }
.big-download:active { transform: scale(.99); }
.big-download.disabled { background: #2a3a4a; color: var(--muted); box-shadow: none; pointer-events: none; }
.big-download .dl-ico {
  width: 48px; height: 48px; border-radius: 10px; background: rgba(5,8,16,.15);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.big-download .dl-text { display: flex; flex-direction: column; text-align: left; }
.big-download .dl-title { font-size: 17px; }
.big-download .dl-sub { font-size: 12px; opacity: .8; font-weight: 500; font-family: var(--mono); }

.file-info { margin-top: 18px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.file-info .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.file-info .row:last-child { border-bottom: none; }
.file-info .row b { color: var(--text); font-weight: 500; }

.ver-badge {
  display: inline-block; background: var(--cyan-dim); color: var(--cyan);
  font-family: var(--mono); font-weight: 700; font-size: 13px;
  padding: 5px 13px; border-radius: 6px; margin-bottom: 10px;
  border: 1px solid rgba(0,229,255,.3);
}
.ver-date { font-size: 12px; color: var(--muted); margin: 0 0 18px; font-family: var(--mono); }
.dl-right h3 { margin: 20px 0 10px; font-size: 12px; font-family: var(--mono); color: var(--cyan); letter-spacing: 2px; }
.notes { margin: 0; padding-left: 18px; color: var(--text); font-size: 14px; }
.notes li { margin-bottom: 6px; }
.requirements { margin-top: 22px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.requirements b { color: var(--text); }

/* ===== 赞助区块 ===== */
.sponsor-card {
  background: linear-gradient(135deg, rgba(0,229,255,.08), rgba(124,77,255,.08));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 28px; text-align: center; margin-bottom: 50px;
}
.sponsor-card .sp-label { font-family: var(--mono); font-size: 11px; color: var(--cyan); letter-spacing: 3px; margin-bottom: 10px; }
.sponsor-card .sp-count { font-size: 42px; font-weight: 800; color: var(--cyan); text-shadow: 0 0 24px rgba(0,229,255,.4); font-family: var(--mono); line-height: 1.2; }
.sponsor-card .sp-desc { font-size: 13px; color: var(--muted); margin: 8px 0 18px; }
.sponsor-btn {
  background: var(--pink); color: #fff; border: none; border-radius: 12px;
  padding: 12px 32px; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: var(--sans); transition: box-shadow .2s, transform .1s;
  box-shadow: 0 0 20px rgba(255,83,112,.3);
}
.sponsor-btn:hover:not(:disabled) { box-shadow: 0 0 32px rgba(255,83,112,.5); transform: scale(1.03); }
.sponsor-btn:disabled { background: #2a3a4a; color: var(--muted); box-shadow: none; cursor: not-allowed; }
.sponsor-btn .heart { display: inline-block; margin-right: 6px; }

/* ===== 烟花 Canvas ===== */
#fwCanvas {
  position: fixed; inset: 0; z-index: 999; pointer-events: none;
  display: none;
}

/* ===== 里程碑弹窗 ===== */
.milestone-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(5,8,16,.85); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.milestone-box {
  background: var(--surface); border: 1px solid var(--cyan);
  border-radius: 20px; padding: 40px; text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 0 60px rgba(0,229,255,.3);
}
.milestone-box .m-ico { font-size: 48px; margin-bottom: 12px; }
.milestone-box h2 { margin: 0 0 10px; font-size: 24px; color: var(--cyan); }
.milestone-box p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
.milestone-box button {
  background: var(--cyan); color: #050810; border: none; border-radius: 10px;
  padding: 10px 28px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--sans);
}

.footer { border-top: 1px solid var(--line); padding: 22px 0; font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: auto; }

@media (max-width: 820px) {
  .dl-layout { grid-template-columns: 1fr; }
  .dl-left { border-right: none; border-bottom: 1px solid var(--line); }
  .hero h1 { font-size: 26px; }
  .nav-links { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="#/" class="brand">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="11" r="3" fill="#00e5ff"/>
          <circle cx="12" cy="17" r="1.6" fill="#00ff9d"/>
        </svg>
      </span>
      <span>萤火虫工作室<small>WEEKEND FIREFLY // DOWNLOAD</small></span>
    </a>
    <nav class="nav-links">
      <a href="#/">~/home</a>
    </nav>
  </div>
</header>

<main class="container" id="homeView">
  <section class="hero">
    <div class="tag">// SYSTEM ONLINE</div>
    <h1>周末的<span class="accent">小萤火虫</span>工作室</h1>
    <p>选择下方产品进入下载页。文件均为 ZIP 压缩包，解压后即可运行。</p>
  </section>
  <section class="product-list" id="productList"></section>

  <!-- 赞助区块 -->
  <section class="sponsor-card" id="sponsorCard">
    <div class="sp-label">// SPONSOR</div>
    <div class="sp-count" id="spCount">0</div>
    <div class="sp-desc">已有这么多人支持萤火虫工作室，每天可点一次</div>
    <button class="sponsor-btn" id="spBtn">
      <span class="heart">❤</span><span id="spBtnText">赞助一下</span>
    </button>
  </section>
</main>

<canvas id="fwCanvas"></canvas>

<main class="container" id="productView" hidden>
  <a href="#/" class="back">← 返回产品列表</a>
  <h1 class="page-title" id="pageTitle"></h1>
  <p class="page-sub" id="pageSub"></p>

  <section class="dl-card">
    <div class="dl-layout">
      <div class="dl-left">
        <div class="platform-tabs" id="platformTabs">
          <button type="button" data-platform="windows" class="active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.5 4.4v7.1H3zM11.6 4.2 21 3v8.5h-9.4zM3 12.6h7.5v7L3 18.5zM11.6 12.6H21V21l-9.4-1.3z"/></svg>
            Windows
          </button>
          <button type="button" data-platform="android">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="6" y="7" width="12" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
            Android
          </button>
        </div>

        <p class="version-label">// SELECT VERSION</p>
        <div class="version-chips" id="versionChips"></div>

        <a class="big-download" id="downloadBtn" href="#">
          <span class="dl-ico">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
          </span>
          <span class="dl-text">
            <span class="dl-title" id="dlTitle">下载</span>
            <span class="dl-sub" id="dlSub"></span>
          </span>
        </a>

        <div class="file-info" id="fileInfo"></div>
      </div>

      <div class="dl-right">
        <span class="ver-badge" id="verBadge"></span>
        <p class="ver-date" id="verDate"></p>
        <h3>// CHANGELOG</h3>
        <ul class="notes" id="notesList"></ul>
        <div class="requirements">
          <b>SYS_REQ:</b> <span id="reqText"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    // 周末的小萤火虫工作室 — files stored in ./downloads/ — ZIP archive
  </div>
</footer>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 产品与文件清单：往 downloads/ 里丢一个 ZIP，
   * 就在这里加一条记录。file 写相对路径。
   * ============================================================ */
  var PRODUCTS = {
    metabox: {
      name: 'MetaBox 启动器',
      subtitle: '我的世界启动器 · PCL2 风格',
      iconColor: '',
      state: { platform: 'windows', version: '1.0.0' },
      releases: [
        {
          version: '1.0.0',
          date: '2026-10-26',
          notes: ['首个正式版本发布', 'PCL2 风格圆角界面', '支持游戏版本一键安装'],
          windows: { file: 'downloads/MetaBox-1.0.0-Windows.zip', size: '76.1 MB' },
          android: null
        }
      ]
    },
    xingye: {
      name: '星野奇旅',
      subtitle: '原创冒险游戏',
      iconColor: 'purple',
      state: { platform: 'windows', version: '1.0.0' },
      releases: [
        {
          version: '1.0.0',
          date: '2026-10-26',
          notes: ['首个版本发布'],
          windows: { file: 'downloads/Xingye-1.0.0-Windows.zip', size: '待测量' },
          android: null
        }
      ]
    }
  };

  var homeView = document.getElementById('homeView');
  var productView = document.getElementById('productView');
  var productList = document.getElementById('productList');
  var pageTitle = document.getElementById('pageTitle');
  var pageSub = document.getElementById('pageSub');
  var platformTabs = document.getElementById('platformTabs');
  var versionChips = document.getElementById('versionChips');
  var downloadBtn = document.getElementById('downloadBtn');
  var dlTitle = document.getElementById('dlTitle');
  var dlSub = document.getElementById('dlSub');
  var fileInfo = document.getElementById('fileInfo');
  var verBadge = document.getElementById('verBadge');
  var verDate = document.getElementById('verDate');
  var notesList = document.getElementById('notesList');
  var reqText = document.getElementById('reqText');
  var activeProduct = null;

  function renderHome() {
    productList.innerHTML = '';
    Object.keys(PRODUCTS).forEach(function (key) {
      var p = PRODUCTS[key];
      var latest = p.releases[p.releases.length - 1];
      var a = document.createElement('a');
      a.className = 'product-entry';
      a.href = '#/' + key;

      var icon = document.createElement('div');
      icon.className = 'pe-icon ' + p.iconColor;
      icon.innerHTML = key === 'metabox'
        ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 12h18"/></svg>'
        : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>';

      var info = document.createElement('div');
      info.className = 'pe-info';
      var name = document.createElement('div'); name.className = 'pe-name'; name.textContent = p.name;
      var desc = document.createElement('div'); desc.className = 'pe-desc'; desc.textContent = p.subtitle;
      var ver = document.createElement('div'); ver.className = 'pe-ver'; ver.textContent = 'v' + latest.version + ' · ' + latest.date;
      info.append(name, desc, ver);

      var arrow = document.createElement('div');
      arrow.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';

      a.append(icon, info, arrow);
      productList.appendChild(a);
    });
  }

  function curP() { return PRODUCTS[activeProduct]; }
  function curR() {
    var p = curP();
    for (var i = 0; i < p.releases.length; i++)
      if (p.releases[i].version === p.state.version) return p.releases[i];
    return p.releases[0];
  }
  function curBuild() {
    var r = curR();
    return curP().state.platform === 'windows' ? r.windows : r.android;
  }

  function renderProductPage() {
    var p = curP();
    pageTitle.textContent = p.name;
    pageSub.textContent = p.subtitle + ' // v' + p.state.version;

    platformTabs.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-platform') === p.state.platform);
    });

    versionChips.innerHTML = '';
    p.releases.forEach(function (r) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip' + (r.version === p.state.version ? ' active' : '');
      c.textContent = 'v' + r.version;
      c.addEventListener('click', function () { p.state.version = r.version; renderProductPage(); });
      versionChips.appendChild(c);
    });

    var r = curR();
    var build = curBuild();
    var plat = p.state.platform === 'windows' ? 'Windows' : 'Android';
    dlSub.textContent = plat + ' · v' + r.version + ' · ZIP';

    if (build && build.file) {
      downloadBtn.classList.remove('disabled');
      downloadBtn.setAttribute('href', build.file);
      downloadBtn.setAttribute('download', '');
      dlTitle.textContent = '下载 ' + p.name + ' v' + r.version;
      fileInfo.innerHTML =
        '<div class="row"><span>FILE</span><b>' + build.file.split('/').pop() + '</b></div>' +
        '<div class="row"><span>SIZE</span><b>' + build.size + '</b></div>' +
        '<div class="row"><span>PLATFORM</span><b>' + plat + '</b></div>';
    } else {
      downloadBtn.classList.add('disabled');
      downloadBtn.removeAttribute('href');
      downloadBtn.removeAttribute('download');
      dlTitle.textContent = plat + ' 版即将推出';
      fileInfo.innerHTML = '<div class="row"><span>STATUS</span><b>暂未上传</b></div>';
    }

    verBadge.textContent = 'v' + r.version;
    verDate.textContent = 'RELEASED: ' + r.date;
    notesList.innerHTML = '';
    r.notes.forEach(function (n) {
      var li = document.createElement('li'); li.textContent = n; notesList.appendChild(li);
    });
    reqText.textContent = p.state.platform === 'windows' ? 'Windows 10/11 64-bit' : 'Android 8.0+';
  }

  platformTabs.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-platform]');
    if (!btn) return;
    curP().state.platform = btn.getAttribute('data-platform');
    renderProductPage();
  });

  /* ============================================================
   * 赞助功能：localStorage 记录总数 + 每日一次
   * ============================================================ */
  var spCountEl = document.getElementById('spCount');
  var spBtn = document.getElementById('spBtn');
  var spBtnText = document.getElementById('spBtnText');

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function getSponsorCount() {
    var n = parseInt(localStorage.getItem('fw_sponsor_count') || '0', 10);
    return isNaN(n) ? 0 : n;
  }
  function hasSponsoredToday() {
    return localStorage.getItem('fw_sponsor_date') === todayStr();
  }
  function renderSponsor() {
    spCountEl.textContent = getSponsorCount();
    if (hasSponsoredToday()) {
      spBtn.disabled = true;
      spBtnText.textContent = '今日已赞助，明天再来';
    } else {
      spBtn.disabled = false;
      spBtnText.textContent = '赞助一下';
    }
  }
  function showMilestone(msg, sub) {
    var ov = document.createElement('div');
    ov.className = 'milestone-overlay';
    ov.innerHTML =
      '<div class="milestone-box">' +
        '<div class="m-ico">🎉</div>' +
        '<h2>' + msg + '</h2>' +
        '<p>' + sub + '</p>' +
        '<button>太棒了</button>' +
      '</div>';
    ov.querySelector('button').addEventListener('click', function () { ov.remove(); });
    document.body.appendChild(ov);
  }
  spBtn.addEventListener('click', function () {
    if (hasSponsoredToday()) return;
    var n = getSponsorCount() + 1;
    localStorage.setItem('fw_sponsor_count', String(n));
    localStorage.setItem('fw_sponsor_date', todayStr());
    renderSponsor();

    if (n === 100) showMilestone('恭喜！100 人赞助达成', '感谢每一位支持萤火虫工作室的朋友');
    else if (n === 1000) showMilestone('恭喜！1000 人赞助达成！', '千人同心，感谢有你');
    else if (n === 10000) {
      showMilestone('万人大关达成！！！', '10000 人赞助，烟花送上！');
      startFireworks();
    }
  });

  /* ============================================================
   * 烟花特效（Canvas 粒子）
   * ============================================================ */
  var fwCanvas = document.getElementById('fwCanvas');
  var fwCtx = fwCanvas.getContext('2d');
  var fwParticles = [];
  var fwRaf = null;
  function fwResize() {
    fwCanvas.width = window.innerWidth;
    fwCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', fwResize);
  function launchFirework() {
    var cx = fwCanvas.width * (0.2 + Math.random() * 0.6);
    var cy = fwCanvas.height * (0.15 + Math.random() * 0.35);
    var hue = Math.floor(Math.random() * 360);
    var count = 60 + Math.floor(Math.random() * 40);
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count;
      var speed = 2 + Math.random() * 4;
      fwParticles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: 'hsl(' + hue + ', 100%, 65%)'
      });
    }
  }
  function fwLoop() {
    fwCtx.fillStyle = 'rgba(5,8,16,0.15)';
    fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
    for (var i = fwParticles.length - 1; i >= 0; i--) {
      var p = fwParticles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.04;
      p.vx *= 0.99; p.vy *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) { fwParticles.splice(i, 1); continue; }
      fwCtx.globalAlpha = p.life;
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      fwCtx.fill();
    }
    fwCtx.globalAlpha = 1;
    if (fwParticles.length > 0) {
      fwRaf = requestAnimationFrame(fwLoop);
    } else {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      fwCanvas.style.display = 'none';
      fwRaf = null;
    }
  }
  function startFireworks() {
    fwResize();
    fwCanvas.style.display = 'block';
    fwParticles = [];
    var shots = 0;
    var timer = setInterval(function () {
      launchFirework();
      shots++;
      if (shots >= 12) clearInterval(timer);
    }, 350);
    if (!fwRaf) fwLoop();
  }
  renderSponsor();

  function route() {
    var h = location.hash || '#/';
    if (h === '#/metabox') { activeProduct = 'metabox'; homeView.hidden = true; productView.hidden = false; renderProductPage(); }
    else if (h === '#/xingye') { activeProduct = 'xingye'; homeView.hidden = true; productView.hidden = false; renderProductPage(); }
    else { activeProduct = null; homeView.hidden = false; productView.hidden = true; renderHome(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
